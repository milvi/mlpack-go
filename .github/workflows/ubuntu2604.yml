name: Ubuntu 26.04 et mémoire native
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ubuntu2604-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construire et vérifier dans Ubuntu 26.04
        run: docker build --progress=plain --build-arg JOBS=2 -t mlpack-go-verification .
      - name: Exécuter k-means
        run: docker run --rm mlpack-go-verification
