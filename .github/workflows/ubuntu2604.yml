name: Ubuntu 26.04 — intégration Go
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ubuntu2604-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construire, vérifier les sommes et les pointeurs dans Ubuntu 26.04
        run: docker build --progress=plain -t mlpack-go-verification .
      - name: Exécuter k-means sur un processus neuf
        run: >-
          docker run --rm --entrypoint /home/mlpack/kmeans mlpack-go-verification
          -n 10000 -k 10 -max-duration 20s
      - name: Mesurer temps et mémoire à budget fixé
        run: >-
          docker run --rm --entrypoint python3 mlpack-go-verification
          tools/benchmark.py --binary /home/mlpack/kmeans --trials 1 --output /tmp/mesures.json

  publication:
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/kmeans-only'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publier le tag immuable après validation
        shell: bash
        run: |
          set -euo pipefail
          version=v0.2.0-kmeans.2
          if git show-ref --verify --quiet "refs/tags/$version"; then
            git merge-base --is-ancestor "$(git rev-parse "$version^{commit}")" "$GITHUB_SHA"
            echo "Préversion déjà publiée ; son tag reste inchangé."
          else
            git tag "$version" "$GITHUB_SHA"
            git push origin "refs/tags/$version"
          fi
